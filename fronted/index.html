
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>

<header>
  <h1>J.A.R.V.I.S</h1>
  <p>PERSONAL AI ASSISTANT</p>
</header>

<div class="core">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="center"></div>
</div>

<div class="core-text">SYSTEM INITIALIZING</div>

<div class="status">
  <h2>SYSTEM STATUS</h2>
  <div class="row">
    <span>AI BRAIN</span>
    <span id="brain" class="off">OFFLINE</span>
  </div>
  <div class="row">
    <span>GEMINI API</span>
    <span id="connection" class="off">DISCONNECTED</span>
  </div>
</div>

<div class="status">
  <label for="apiKey">GEMINI API KEY</label>
  <input id="apiKey" type="password" placeholder="Enter your API key">
</div>

<div class="chat" id="chat">
  <div class="msg ai">J.A.R.V.I.S: Hello Boss. Systems ready.</div>
</div>

<div class="input-area">
  <input id="msg" type="text" placeholder="Talk to Jarvis...">
  <button id="send">SEND</button>
</div>

</body>
</html>
